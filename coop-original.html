<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0814">
<title>Wave Defense RPG · 협동</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0814}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0a0814}</style>
</head>
<body>
<iframe id="game" src="./single.html?v=coop-original-1" allow="fullscreen; autoplay"></iframe>
<script>
const f=document.getElementById('game');
f.addEventListener('load',()=>{
  try{
    const d=f.contentDocument;
    if(d.getElementById('coopOriginalBridge'))return;
    const s=d.createElement('script');
    s.id='coopOriginalBridge';
    s.src='./coop-original-bridge.js?v=1';
    d.body.appendChild(s);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
