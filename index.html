<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0a0814"><title>Wave Defense RPG</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0814;color:#fff;font-family:'Malgun Gothic',system-ui,sans-serif}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#20103d 0,#0a1020 42%,#070810 100%)}.wrap{text-align:center;width:min(760px,94vw);padding:30px}.wave{font-size:64px;font-weight:1000;letter-spacing:8px;color:#ffc828;text-shadow:0 0 34px #ffc82877}.sub{font-size:34px;font-weight:900;letter-spacing:7px;color:#4af0b0;text-shadow:0 0 24px #4af0b066;margin-bottom:30px}.desc{background:#ffffff0d;border:1px solid #2a2840;border-radius:14px;padding:14px 18px;color:#aab2c2;font-size:13px;line-height:1.9;margin:0 auto 26px;max-width:620px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mode{border-radius:16px;padding:22px 12px;font-size:20px;font-weight:900;cursor:pointer;transition:.15s transform,.15s filter;border:2px solid}.mode:hover{transform:translateY(-3px);filter:brightness(1.12)}.normal{background:linear-gradient(135deg,#ffc828,#ff8c00);border-color:#ffd95d;color:#160d00;box-shadow:0 0 34px #ffc82844}.hell{background:linear-gradient(135deg,#8b0000,#2a0000);border-color:#ff3030;color:#ff7777;box-shadow:0 0 34px #ff202044}.coop{background:linear-gradient(135deg,#124a67,#081d2b);border-color:#4af0ff;color:#9af8ff;box-shadow:0 0 34px #4af0ff3d}.small{display:block;font-size:11px;font-weight:600;opacity:.78;margin-top:7px}#stage{position:fixed;inset:0;display:none;background:#000}#gameFrame{width:100%;height:100%;border:0;background:#000}#back{position:fixed;z-index:20;left:10px;top:10px;display:none;border:1px solid #65758b;background:#101522dd;color:#fff;border-radius:9px;padding:7px 11px;font-weight:800;cursor:pointer}@media(max-width:720px){.wave{font-size:43px}.sub{font-size:23px}.modes{grid-template-columns:1fr}.mode{padding:15px}.desc{display:none}}</style></head><body><div id="menu"><div class="wrap"><div class="wave">WAVE</div><div class="sub">DEFENSE RPG</div><div class="desc">⚔ 일반 성장 플레이 · 🔥 지옥 난이도 · 🤝 2~4인 실시간 협동<br>협동은 접속 인원에 따라 적 HP·적 수·보스 HP가 자동 보정되며 인원별 랭킹이 분리됩니다.</div><div class="modes"><button class="mode normal" onclick="launch('normal')">▶ 일반 모드<span class="small">기존 싱글 플레이</span></button><button class="mode hell" onclick="launch('hell')">🔥 지옥 모드<span class="small">강화 적 · 극한 난이도</span></button><button class="mode coop" onclick="launch('coop')">🤝 협동 모드<span class="small">2~4인 온라인 멀티</span></button></div></div></div><div id="stage"><iframe id="gameFrame" allow="autoplay; fullscreen"></iframe></div><button id="back" onclick="backMenu()">← 모드 선택</button><script>const menu=document.getElementById('menu'),stage=document.getElementById('stage'),frame=document.getElementById('gameFrame'),back=document.getElementById('back');function launch(mode){menu.style.display='none';stage.style.display='block';back.style.display='block';if(mode==='coop'){frame.onload=null;frame.src='./coop.html?server='+encodeURIComponent('wss://pixco-wave-defense-coop.onrender.com');return}frame.onload=()=>{const w=frame.contentWindow;let n=0;const t=setInterval(()=>{n++;try{if(typeof w.startGame==='function'){clearInterval(t);w.startGame(mode==='hell')}}catch(e){}if(n>120)clearInterval(t)},50)};frame.src='./single.html'}function backMenu(){try{frame.contentWindow.location.replace('about:blank')}catch(e){}frame.src='about:blank';stage.style.display='none';back.style.display='none';menu.style.display='flex'}</script></body></html>
