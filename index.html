<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0814">
<title>Wave Defense RPG</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0814}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0a0814}</style>
</head>
<body>
<iframe id="game" src="./single.html?v=original-coop-main-1" allow="fullscreen; autoplay"></iframe>
<script>
const f=document.getElementById('game');
function inject(){
  try{
    const d=f.contentDocument;if(!d)return;
    const s=d.getElementById('sbtn'),h=d.getElementById('hbtn');if(!s||!h||d.getElementById('coopbtn'))return;
    const row=s.parentElement;
    const b=d.createElement('button');
    b.id='coopbtn';b.type='button';b.textContent='🤝 협동 모드';
    b.style.cssText='background:linear-gradient(135deg,#125d72,#082632);border:2px solid #4af0ff;border-radius:14px;padding:16px 36px;font-size:19px;font-weight:bold;color:#9af8ff;cursor:pointer;font-family:inherit;box-shadow:0 0 40px #4af0ff55;transition:transform .1s,box-shadow .1s';
    b.onmouseenter=()=>b.style.transform='scale(1.05)';b.onmouseleave=()=>b.style.transform='scale(1)';
    b.onclick=()=>location.href='./coop-original.html';
    row.appendChild(b);
    const note=d.createElement('div');note.id='coopnote';note.textContent='협동 모드: 원본 게임 그대로 2~4인 실시간 플레이';note.style.cssText='margin-top:7px;font-size:11px;color:#4af0ff';
    row.parentElement.insertBefore(note,row.nextSibling);
  }catch(e){console.error(e)}
}
f.addEventListener('load',()=>{inject();setTimeout(inject,300)});
</script>
</body>
</html>
